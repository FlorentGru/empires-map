# Atlas des Empires dans son propre conteneur nginx, sur le port 8081, à côté des conteneurs de l'autre projet.
# Installation : sudo mkdir -p /opt/atlas && sudo cp deploy/docker-compose.atlas.yml deploy/nginx-atlas.conf /opt/atlas/
#                cd /opt/atlas && sudo docker compose -f docker-compose.atlas.yml up -d
# Le conteneur lit /var/www/atlas (rempli par le workflow VPS) en lecture seule.
services:
  atlas:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '8081:8081'
    volumes:
      - /var/www/atlas:/var/www/atlas:ro
      - ./nginx-atlas.conf:/etc/nginx/conf.d/default.conf:ro
