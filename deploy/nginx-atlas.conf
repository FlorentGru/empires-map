# Atlas des Empires servi par le nginx du VPS, sur un port à part (8081) : l'autre projet n'est pas touché.
# Installation : sudo cp deploy/nginx-atlas.conf /etc/nginx/sites-available/atlas
#                sudo ln -s /etc/nginx/sites-available/atlas /etc/nginx/sites-enabled/atlas
#                sudo nginx -t && sudo systemctl reload nginx
server {
    listen 8081;
    # listen [::]:8081;   # décommenter si le VPS a l'IPv6
    server_name _;

    root /var/www/atlas;
    index index.html;

    # Pages pré-rendues : /rome/cannes-216/ → /rome/cannes-216/index.html ; sinon la page 404 du site.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
    error_page 404 /404.html;

    # Fichiers JS/CSS à empreinte (nom changé à chaque build) : cache long.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Worker de MapLibre (.mjs) : le mime.types d'Ubuntu ne connaît pas l'extension et l'envoie en
    # application/octet-stream ; le navigateur refuse alors de l'exécuter et la carte reste vide.
    location ~ \.mjs$ {
        default_type text/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Données géographiques (.geojson, inconnues de nginx) : type JSON pour qu'elles soient compressées.
    location ~ \.geojson$ {
        default_type application/geo+json;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/geo+json image/svg+xml text/plain;
}
