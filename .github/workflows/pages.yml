# Mise en ligne gratuite sur GitHub Pages à chaque push sur main.
# À activer une fois dans le dépôt : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
# Version statique : le sage et le quiz rédigé par l'IA (serveur Python + clé) n'y sont pas ; le quiz hors ligne oui.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Le site est servi sous https://<compte>.github.io/<dépôt>/ : les chemins partent de ce préfixe.
      - run: npx vite build --base=/${{ github.event.repository.name }}/
        env:
          VITE_STATIC: '1'
      # Une page 404 qui renvoie vers l'app (liens directs ?empire=…&step=… compris).
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
