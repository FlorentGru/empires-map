# Mise en ligne gratuite sur GitHub Pages à chaque push sur main.
# Activé dans le dépôt (Settings → Pages → Source : « GitHub Actions ») : https://florentgru.github.io/empires-map/
# Version statique : le sage et le quiz rédigé par l'IA (serveur Python + clé) n'y sont pas ; le quiz hors ligne oui.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Adresse publique du site (https://<compte>.github.io/<dépôt>/, ou le nom de domaine s'il y en a un).
      - id: pages
        uses: actions/configure-pages@v5
      # Les chemins partent du préfixe du site (« /empires-map/ », ou « / » avec un nom de domaine).
      - run: npx vite build --base=${{ steps.pages.outputs.base_path }}/
        env:
          VITE_STATIC: '1'
      # Pages statiques (une par empire, étape et synthèse), sitemap.xml, robots.txt, llms.txt et 404.html.
      - run: npx tsx scripts/prerender.ts
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
